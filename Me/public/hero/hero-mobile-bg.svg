    </radialGradient>
    <radialGradient id="m-glow-right" cx="92%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-glow-mid" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
